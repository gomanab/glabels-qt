name: Build gLabels 4 Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Qt6 and Build Tools
        run: |
          choco install cmake ninja qt6-base-dev -y

      - name: Add Qt Binaries to Global PATH
        shell: powershell
        run: |
          # Find the Qt runtime directory containing Qt6Core.dll and persist it to GITHUB_PATH
          $qtDllDir = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\qt6-base-dev" -Recurse -Filter "Qt6Core.dll" | Select-Object -First 1 -ExpandProperty DirectoryName
          echo "$qtDllDir" >> $env:GITHUB_PATH

      - name: Configure CMake
        shell: powershell
        run: |
          mkdir build
          cd build
          cmake -G "Ninja" ..

      - name: Build gLabels 4
        shell: powershell
        run: |
          cd build
          ninja

      - name: Package Executable and Dependencies
        shell: powershell
        run: |
          $qtToolDir = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\qt6-base-dev" -Recurse -Filter "windeployqt.exe" | Select-Object -First 1 -ExpandProperty DirectoryName
          $env:PATH = "$qtToolDir;$env:PATH"
          
          mkdir dist
          Copy-Item build/glabels-qt.exe dist/
          windeployqt --no-compiler-runtime dist/glabels-qt.exe

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: glabels-4-windows-x64
          path: dist/
