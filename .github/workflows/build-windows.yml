name: Build gLabels 4 Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Qt6 and Build Tools
        run: |
          choco install cmake ninja qt6-base-dev -y

      - name: Configure Qt Environment
        shell: powershell
        run: |
          # Locate Qt6 binary folders containing Qt6Core.dll and windeployqt.exe
          $qtBins = Get-ChildItem -Path "C:\ProgramData\chocolatey", "C:\tools" -Recurse -Filter "Qt6Core.dll" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty DirectoryName -Unique
          
          foreach ($dir in $qtBins) {
            echo "$dir" >> $env:GITHUB_PATH
            Write-Host "Added to GITHUB_PATH: $dir"
          }

      - name: Configure CMake
        shell: powershell
        run: |
          mkdir build
          cd build
          cmake -G "Ninja" ..

      - name: Build gLabels 4
        shell: powershell
        run: |
          cd build
          ninja

      - name: Package Executable and Dependencies
        shell: powershell
        run: |
          mkdir dist
          Copy-Item build/glabels-qt.exe dist/
          windeployqt --no-compiler-runtime dist/glabels-qt.exe

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: glabels-4-windows-x64
          path: dist/
