name: Build gLabels 4 Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Qt6 and Build Tools
        run: |
          choco install cmake ninja qt6-base-dev -y

      - name: Configure CMake
        shell: powershell
        run: |
          # Add Qt binaries to system PATH so build-time executables (like XmlStrings.exe) can find Qt DLLs
          $env:PATH = "C:\tools\Qt\6.x.x\mingw_64\bin;C:\ProgramData\chocolatey\lib\qt6-base-dev\tools;$env:PATH"
          
          mkdir build
          cd build
          cmake -G "Ninja" ..

      - name: Build gLabels 4
        shell: powershell
        run: |
          # Set PATH for Ninja execution phase
          $qtDir = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\qt6-base-dev" -Recurse -Filter "QtCore.dll" | Select-Object -First 1 -ExpandProperty DirectoryName
          $env:PATH = "$qtDir;$env:PATH"
          
          cd build
          ninja

      - name: Package Executable and Dependencies
        shell: powershell
        run: |
          $qtDir = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\qt6-base-dev" -Recurse -Filter "windeployqt.exe" | Select-Object -First 1 -ExpandProperty DirectoryName
          $env:PATH = "$qtDir;$env:PATH"
          
          mkdir dist
          Copy-Item build/glabels-qt.exe dist/
          windeployqt --no-compiler-runtime dist/glabels-qt.exe

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: glabels-4-windows-x64
          path: dist/
